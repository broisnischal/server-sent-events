# azure-pipelines.yml
trigger:
  branches:
    include:
      - main  # Adjust based on your branch

pool:
  name: ubuntu
  demands:
    - agent.name -equals web

steps:
  # Step 1: Checkout the repository
  - task: Checkout@1
    displayName: "Checkout code"

  # Step 2: Install Node.js
  - task: UseNode@1
    inputs:
      versionSpec: '16.x'  # Adjust based on your needs
      checkLatest: true
    displayName: "Set up Node.js"

  # Step 3: Install dependencies
  - script: |
      npm ci
    displayName: "Install dependencies"

  # Step 4: Build the Remix app
  - script: |
      npm run build
    displayName: "Build Remix app"

  # Step 5: Run tests
  - script: |
      npm test
    displayName: "Run tests"
